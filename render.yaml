services:
  - type: web
    name: mirai-stock-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: TYPESAFE_API_KEY
        sync: false
      - key: TYPESAFE_MODEL
        value: jev-1.13.0
      - key: STOCK_API_TOKEN
        generateValue: true
      - key: API_REQUESTS_PER_MINUTE
        value: "30"
      - key: API_DAILY_COMPUTE_LIMIT
        value: "200"
      - key: API_CACHE_TTL_SECONDS
        value: "3600"
